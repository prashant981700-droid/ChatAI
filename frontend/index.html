<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatAI</title><link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script></head><body>
<div id="auth"><div class="authbox"><div class="logo">✦</div><h1>Welcome to ChatAI</h1><p>Your personal AI assistant.</p><div id="form"></div></div></div>
<div id="app" class="hidden"><aside><b class="brand">✦ ChatAI</b><button onclick="newChat()">＋ New chat</button><input id="find" placeholder="Search chats"><div id="history"></div><div class="bottom"><button onclick="theme()">◐ Theme</button><button onclick="logout()">⇥ Log out</button></div></aside><main><header><span class="mobilebrand">✦ ChatAI</span><span id="badge">OLLAMA AI</span></header><section id="messages"><div class="welcome"><div class="big">✦</div><h2>How can I help you?</h2><p>Ask anything. Learn, code, brainstorm, or build.</p><div class="suggest"><button onclick="prompt('Explain DBMS in simple language')">Explain DBMS</button><button onclick="prompt('Give me a Python project idea')">Python project</button><button onclick="prompt('Help me prepare for an exam')">Exam prep</button><button onclick="prompt('Write a C++ sorting program')">Write code</button></div></div></section><div class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message ChatAI..."></textarea><label class="attach" title="Attach file">📎<input id="file" type="file" accept=".pdf,.txt,.md,.py,.js,.cpp,.java,.html,.css,.json,.csv" onchange="uploadFile()"></label><button id="send">➤</button></div><small>ChatAI can make mistakes. Check important information.</small></div></main></div><script src="/js/app.js"></script></body></html>
